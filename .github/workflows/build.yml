name: Build Nintendo 3DS

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  build:
    name: Build 3DS
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check devkitPro environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "=== Compiler ==="
          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version

          echo "=== Make ==="
          which make
          make --version

          echo "=== tex3ds ==="
          which tex3ds
          tex3ds --version || true

          echo "=== Libraries ==="
          find /opt/devkitpro -name 'libbox2d.a' -o \
               -name 'libcitro2d.a' -o \
               -name 'libcitro3d.a' -o \
               -name 'libctru.a'

          echo "=== 3ds_rules ==="
          ls -l "$DEVKITARM/3ds_rules"

      - name: Build
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j$(nproc)

      - name: Verify build
        run: |
          test -f ambidextro3ds.3dsx
          test -f ambidextro3ds.elf
          test -f ambidextro3ds.smdh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ambidextro3ds-${{ github.sha }}
          path: |
            ambidextro3ds.3dsx
            ambidextro3ds.elf
            ambidextro3ds.smdh
